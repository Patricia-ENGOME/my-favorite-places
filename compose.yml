services:
  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "3000:3000"

  server:
    build:
      target: main
      context: ./server
    restart: unless-stopped
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: supersecret
    ports:
      - "5432:5432"
    volumes:
      - /var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
